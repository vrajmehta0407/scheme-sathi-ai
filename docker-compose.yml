version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: schemesathi-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: schemesathi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: schemesathi-api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/schemesathi_dev
      ENVIRONMENT: development
      ADMIN_SECRET: dev_admin_secret_key_change_in_production
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:

